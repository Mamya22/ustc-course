<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>教师教学科研管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>document.addEventListener("DOMContentLoaded", function() {
        // 根据结果显示相应的 Toast
        const result = "{{ result }}";  // 从 Flask 传递的结果
        if (result) {
            const toastElement = document.getElementById('resultToast');
            const toastBody = document.getElementById('toastBody');
            if (result == "success") {
                toastBody.textContent = "添加成功！";
                toastElement.classList.add('bg-success');
            } else if(result === "fail"){
                toastBody.textContent = "添加失败！";
                toastElement.classList.add('bg-danger');
            }
            else if(result === "总学时不对等"){
                toastBody.textContent = "总学时不对等！";
                toastElement.classList.add('bg-danger');
            }
            else if (result == "该课程不存在") {
                toastBody.textContent = "该课程不存在";
                toastElement.classList.add('bg-danger');
            } 
            // else if(result === "update_fail"){
            //     toastBody.textContent = "更新失败！";
            //     toastElement.classList.add('bg-danger');
            // }
            const toast = new bootstrap.Toast(toastElement);
            toast.show();  // 显示 Toast
        }
    });
</script>
    <script>
        let teacherCount = 1; // 初始化老师数量

        function addTeacherField() {
            teacherCount++;
            const teacherContainer = document.getElementById('teacherContainer');
            const newTeacherField = document.createElement('div');
            newTeacherField.className = 'mb-3 row'; // 使用row类
            newTeacherField.innerHTML = `
            <div class="col-md-8">
                <label for="teacherID${teacherCount}" class="form-label">老师工号</label>
                <input type="text" class="form-control" id="teacherID${teacherCount}" name="teachers" placeholder="请输入老师工号"  required>
            </div>
            <div class="col-md-4 d-flex align-items-center">
                <label for="hours${teacherCount}" class="form-label">承担学时</label>
                <input type="text" class="form-control" id="hours${teacherCount}" name="course_times" placeholder="请输入承担学时"  required>
            </div>
        `;
            teacherContainer.appendChild(newTeacherField);
        }
    </script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" alt="Logo" width="30" height="30"
                    class="d-inline-block align-text-top">
                教师科研管理系统
            </a>
            <ul class="nav nav-pills nav-fill">
                <li class="nav-item">
                    <a class="nav-link" href="/paper/show">论文</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/project/show">项目</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/course/show">课程</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/id/show">综合查询</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <nav aria-label="...">
                    <ul class="pagination pagination-lg">
                        <li class="page-item"><a class="page-link" href="/course/show">课程查询</a></li>
                        <li class="page-item"><a class="page-link" href="/course/add">课程新增</a></li>
                        <li class="page-item active" aria-current="page">
                            <span class="page-link">主讲信息新增</span>
                        </li>
                    </ul>
                </nav>
            </div>
            <div class="card-body">
                <form action="/course/add_teach" method="POST" class="row g-3">
                    <div class="col-md-4">
                        <label for="courseID" class="form-label">课程号</label>
                        <input type="text" class="form-control" id="courseID" name="course_id"
                            placeholder="请输入课程号" value="{{request.form.get('course_id', '')}}" required>
                    </div>

                    <div class="col-md-4">
                        <label for="courseYear" class="form-label">年份：</label>
                            <input type="number" class="form-control" name="course_year"  id="courseYear"placeholder="年份" value="{{request.form.get('course_year', '')}}" required>
                    </div>

                    <div class="col-md-4">
                        <label for="term" class="form-label">学期</label>
                        <select class="form-select" id="term" name="term" value="{{request.form.get('term', '')}}">
                            <option selected disabled>请选择</option>
                            <option value="1">春季学期</option>
                            <option value="2">夏季学期</option>
                            <option value="3">秋季学期</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">老师工号</label>
                        <div id="teacherContainer">
                            <div class="mb-3 row">
                                <div class="col-md-8">
                                    <input type="text" class="form-control" id="teacherName1" name="teachers"
                                        placeholder="请输入老师工号" required>
                                </div>
                                <div class="col-md-4 d-flex align-items-center">
                                    <label for="courseTime1" class="form-label">承担学时：</label>
                                        <input type="number" class="form-control" name="course_times"  id="courseTime1" placeholder="承担学时"  required>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-secondary" onclick="addTeacherField()">添加老师</button>

                    </div>

                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-primary">提交</button>
                    </div>
                </form>

            </div>
        </div>
                <!-- Toast 组件 -->
                <div class="toast" id="resultToast" role="alert" aria-live="assertive" aria-atomic="true" style="position: absolute; top: 20px; right: 20px;">
                    <div class="toast-header">
                        <strong class="me-auto">提示</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body" id="toastBody">
                        <!-- 消息内容 -->
                    </div>
                </div>
</body>
